name: Přepočítat po ručním zápisu

on:
  push:
    paths:
      - "manual_entries.json"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4

      - name: Nastavit Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Načíst ručně zapsané hodnoty
        run: python seed_history.py

      - name: Vygenerovat REPORT.md
        run: python export_report_md.py

      - name: Vygenerovat data pro web
        run: python export_report_json.py

      - name: Zkopírovat zápisy pro formulář
        run: cp manual_entries.json docs/manual_entries.json

      - name: Commitnout přepočítaná data
        run: |
          git config user.name "ig-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add followers.db REPORT.md docs/data.json docs/manual_entries.json
          git diff --staged --quiet || git commit -m "Přepočet po ručním zápisu ($(date -u +%Y-%m-%d))"
          git push
